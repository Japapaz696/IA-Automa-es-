<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1218"/>
      <stop offset="45%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>
    <radialGradient id="deskLight" cx="38%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#1A3A48" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#0B1820" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#05070A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenGlow" cx="62%" cy="48%" r="38%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#22D3EE" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C242E"/>
      <stop offset="100%" stop-color="#0C1016"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4A07A"/>
      <stop offset="100%" stop-color="#8B6A4A"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="900" height="1100" fill="url(#bg)"/>
  <ellipse cx="340" cy="430" rx="420" ry="340" fill="url(#deskLight)"/>
  <ellipse cx="560" cy="500" rx="300" ry="260" fill="url(#screenGlow)"/>

  <!-- Window light -->
  <rect x="0" y="80" width="18" height="420" fill="#22D3EE" opacity="0.08"/>
  <rect x="28" y="110" width="8" height="280" fill="#F0F4F8" opacity="0.04"/>

  <!-- Desk -->
  <path d="M40 780 L860 760 L900 1100 L0 1100 Z" fill="#121820"/>
  <path d="M40 780 L860 760 L870 790 L50 812 Z" fill="#1A2430"/>
  <rect x="70" y="812" width="720" height="8" fill="#22D3EE" opacity="0.12"/>

  <!-- Monitor -->
  <rect x="430" y="290" width="390" height="250" rx="10" fill="#0A1016" stroke="#1E2A36" stroke-width="6"/>
  <rect x="442" y="304" width="366" height="222" rx="4" fill="#07141C"/>
  <rect x="590" y="540" width="70" height="18" fill="#151C24"/>
  <rect x="520" y="558" width="210" height="10" rx="2" fill="#1A222C"/>

  <!-- Monitor UI lines -->
  <rect x="462" y="328" width="90" height="8" rx="2" fill="#22D3EE" opacity="0.55"/>
  <rect x="462" y="352" width="220" height="6" rx="2" fill="#8B96A5" opacity="0.25"/>
  <rect x="462" y="372" width="180" height="6" rx="2" fill="#8B96A5" opacity="0.18"/>
  <rect x="462" y="408" width="140" height="48" rx="6" fill="#0E1A22" stroke="#22D3EE" stroke-opacity="0.25"/>
  <rect x="620" y="408" width="140" height="48" rx="6" fill="#0E1A22"/>
  <rect x="462" y="472" width="298" height="6" rx="2" fill="#22D3EE" opacity="0.2"/>

  <!-- Laptop -->
  <path d="M180 640 L430 628 L448 742 L168 758 Z" fill="#0D141C" stroke="#22303C" stroke-width="3"/>
  <path d="M190 650 L418 640 L430 728 L178 740 Z" fill="#081018"/>
  <path d="M150 758 L470 742 L490 772 L130 790 Z" fill="#1A2430"/>
  <rect x="250" y="668" width="80" height="6" rx="2" fill="#22D3EE" opacity="0.45"/>
  <rect x="250" y="686" width="140" height="5" rx="2" fill="#8B96A5" opacity="0.2"/>
  <rect x="250" y="700" width="110" height="5" rx="2" fill="#8B96A5" opacity="0.14"/>

  <!-- Person silhouette — no identifiable face, from behind/side -->
  <g transform="translate(40,210)">
    <!-- Head -->
    <ellipse cx="210" cy="168" rx="58" ry="70" fill="url(#skin)"/>
    <!-- Hair -->
    <path d="M158 150 C160 90, 260 80, 268 155 C250 120, 170 118, 158 150 Z" fill="#1A1512"/>
    <path d="M152 155 C148 200, 155 230, 168 238 L175 180 Z" fill="#1A1512"/>
    <!-- Neck -->
    <path d="M188 230 L232 228 L240 280 L178 284 Z" fill="url(#skin)"/>
    <!-- Shirt collar -->
    <path d="M168 276 L242 272 L258 310 L210 340 L160 314 Z" fill="#E8EEF4"/>
    <!-- Suit -->
    <path d="M90 300 C140 270, 180 278, 210 318 C240 278, 290 268, 340 308 L380 720 L40 740 Z" fill="url(#suit)"/>
    <!-- Lapel -->
    <path d="M210 318 L168 400 L210 430 L252 396 Z" fill="#0A0E14" opacity="0.7"/>
    <!-- Shoulder light -->
    <path d="M250 310 C300 290, 340 330, 350 420 L320 430 C310 350, 280 320, 250 310 Z" fill="#22D3EE" opacity="0.06"/>
    <!-- Arm on desk -->
    <path d="M300 430 C360 470, 400 560, 390 640 L330 650 C340 560, 310 490, 270 450 Z" fill="#141C26"/>
    <ellipse cx="378" cy="648" rx="28" ry="16" fill="url(#skin)"/>
  </g>

  <!-- Ambient particles -->
  <g fill="#22D3EE">
    <circle cx="520" cy="180" r="2" opacity="0.5"/>
    <circle cx="700" cy="220" r="1.5" opacity="0.35"/>
    <circle cx="780" cy="400" r="2" opacity="0.4"/>
    <circle cx="640" cy="140" r="1.2" opacity="0.45"/>
    <circle cx="120" cy="240" r="1.4" opacity="0.3"/>
  </g>
</svg>
